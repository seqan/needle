# Builds and tests the documentation. PRs: upload the HTML; docs_preview.yml publishes it from the default branch.
# Push to main and hibf: deploy to docs.seqan.de from a separate job, so the server key never shares a job with
# CMake/Doxygen. Stays a separate workflow (not a CI stage) so that the preview appears as soon as this finishes.

name: Documentation

on:
  push:
    branches:
      - 'main'
      - 'hibf'
  pull_request:
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

env:
  SHARG_NO_VERSION_CHECK: 1
  TZ: Europe/Berlin

defaults:
  run:
    shell: bash -Eeuxo pipefail {0}

jobs:
  build:
    name: Documentation
    runs-on: ubuntu-latest
    if: github.repository_owner == 'seqan' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # locked via actions.lock
        with:
          persist-credentials: false

      - name: Install Doxygen
        uses: seqan/actions/setup-doxygen@main
        with:
          doxygen: 1.9.4

      - name: Configure docs
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release \
                   -DNEEDLE_TEST=OFF \
                   -DNEEDLE_DOCS=ON

      - name: Build docs
        working-directory: build
        run: make doc

      # For docs_preview.yml (PRs) and the deploy job below. docs_preview.yml expects these artifact names.
      - name: Upload documentation
        uses: actions/upload-artifact@v7 # locked via actions.lock
        with:
          name: documentation
          path: build/html/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy Documentation
    needs: build
    if: github.repository_owner == 'seqan' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hibf')
    runs-on: ubuntu-latest
    environment: server-deploy # deployment branches: main, hibf; holds the server key
    steps:
      - name: Download documentation
        uses: actions/download-artifact@v8 # locked via actions.lock
        with:
          name: documentation
          path: html

      # Plain rsync with a pinned host key (no third-party deploy action): the key grants the whole server.
      # Same targets as before.
      - name: Deploy
        uses: seqan/actions/documentation_deploy_production@main
        with:
          deploy_host: ${{ secrets.DEPLOY_HOST }}
          deploy_user: ${{ secrets.DEPLOY_USER }}
          deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
          source_path_user_doc: html/
          deploy_path_user_doc: ${{ secrets.DEPLOY_PRODUCTION_BASE_PATH }}/${{ github.ref_name }}
